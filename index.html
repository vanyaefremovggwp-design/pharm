<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Ефремов Иван Владимирович">
<meta name="description" content="Тренажёр по тесту «Общая фармакология, модуль 1»: заучивание, пробный тест, все вопросы с ответами. Автор — Ефремов Иван Владимирович.">
<meta name="theme-color" content="#2447b8">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Тренажёр: общая фармакология</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow working column; a quiet header with three modes; the question card is the only "object" on the page. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#16202e; --muted:#5d6a7c; --line:#d5dbe4;
  --accent:#2447b8; --accent-ink:#ffffff; --accent-soft:#e4eafb;
  --marker:#f7a8d8; --marker-ink:#3a0a2a;
  --ok:#1f7a4d; --ok-soft:#e0f3e8; --bad:#b3261e; --bad-soft:#fbe4e2; --warn:#8a5a00;
  --f-read:'Literata',Georgia,'Times New Roman',serif;
  --f-ui:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-num:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10151d; --surface:#19212d; --ink:#e8edf5; --muted:#98a5b8; --line:#2c3848;
  --accent:#8fa9ff; --accent-ink:#0c1530; --accent-soft:#1f2b4d;
  --marker:#a8327f; --marker-ink:#ffffff;
  --ok:#62d39a; --ok-soft:#163626; --bad:#ff8a80; --bad-soft:#40201e; --warn:#f0c060;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#10151d; --surface:#19212d; --ink:#e8edf5; --muted:#98a5b8; --line:#2c3848;
  --accent:#8fa9ff; --accent-ink:#0c1530; --accent-soft:#1f2b4d;
  --marker:#a8327f; --marker-ink:#ffffff;
  --ok:#62d39a; --ok-soft:#163626; --bad:#ff8a80; --bad-soft:#40201e; --warn:#f0c060;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45}
.wrap{max-width:740px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:12px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-ui);font-weight:700;font-size:20px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.src{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{flex:1;min-width:0;border:0;background:transparent;color:var(--muted);font:600 14px var(--f-ui);padding:9px 8px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* progress */
.prog{display:flex;flex-direction:column;gap:8px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-mid{background:var(--accent)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend b{color:var(--ink);font-family:var(--f-num);font-weight:500}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:18px}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.q{font-family:var(--f-read);font-weight:600;font-size:21px;line-height:1.35;margin:0;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;font:500 16px/1.4 var(--f-ui);cursor:pointer}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font:500 12px var(--f-num);color:var(--muted)}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok)}
.opt.right .t span{background:var(--marker);color:var(--marker-ink);padding:1px 4px;border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;min-height:44px}
.verdict{font-weight:600}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--marker);padding-left:10px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font:600 15px var(--f-ui);padding:11px 20px;border-radius:9px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
.btn.danger{background:var(--bad);color:var(--surface)}
.hint{font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{align-items:center;text-align:center}
.big{font:500 44px/1 var(--f-num)}
h2{font:700 18px var(--f-ui);margin:0}
p{margin:0}

/* exam */
.timer{font:500 15px var(--f-num)} .timer.low{color:var(--bad)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dots button{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 12px var(--f-num);cursor:pointer;padding:0}
.dots button.done{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.dots button.cur{outline:2px solid var(--accent);outline-offset:1px}

/* list */
.search{width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:400 16px var(--f-ui)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font:600 13px var(--f-ui);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.item{border-top:1px solid var(--line);padding-block:14px;display:flex;flex-direction:column;gap:6px}
.item .iq{font-family:var(--f-read);font-weight:600;font-size:16px}
.item .n{font:500 12px var(--f-num);color:var(--muted);margin-right:8px}
.item ol{margin:0;padding-left:22px;font-size:15px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.item li.c{color:var(--ink)} .item li.c span{background:var(--marker);color:var(--marker-ink);padding:0 4px;border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.tag{font:600 11px var(--f-ui);letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.mid{background:var(--accent-soft);color:var(--accent)}
.credit{border-top:1px solid var(--line);padding-top:16px;font-size:13px;color:var(--muted);text-align:center}
.credit b{color:var(--ink);font-weight:600}
@media (max-width:480px){ .card{padding:16px} .q{font-size:19px} .tabs button{font-size:13px;padding:9px 4px} }
@media (prefers-reduced-motion:no-preference){ .opt,.tabs button{transition:border-color .12s,background-color .12s} }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Общая фармакология · Модуль 1</h1>
      <span class="src">105 вопросов · автор тренажёра Ефремов И. В.</span>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-learn" data-tab="learn">Заучивание</button>
      <button role="tab" id="tab-exam" data-tab="exam">Пробный тест</button>
      <button role="tab" id="tab-list" data-tab="list">Все вопросы</button>
    </div>
  </header>
  <main id="view"></main>
  <footer class="credit">Сделал <b>Ефремов Иван Владимирович</b> · по тесту кафедры фармакологии «Общая фармакология, модуль 1»</footer>
</div>

<script>
const QS = [{"n": 1, "q": "К понятию \"фармакокинетика\" относится", "o": ["биотрансформация", "механизм действия", "побочные эффекты", "виды действия"], "c": 0}, {"n": 2, "q": "Способность веществ связываться со специфическими рецепторами обозначается как", "o": ["внутренняя активность", "аффинитет", "депонирование", "аллостерическое взаимодействие"], "c": 1}, {"n": 3, "q": "К энтеральным путям введения не относится введение лекарственных веществ", "o": ["в 12-ти перстную кишку", "ингаляционно", "ректально", "перорально"], "c": 1}, {"n": 4, "q": "Масляные растворы нельзя применять", "o": ["подкожно", "накожно", "внутримышечно", "внутривенно"], "c": 3}, {"n": 5, "q": "Ошибочное утверждение об активном транспорте веществ через биологические мембраны", "o": ["Может осуществляться против градиента концентрации", "Характеризуется отсутствием избирательности к определенным веществам", "Требует затраты энергии", "Характеризуется насыщаемостью"], "c": 1}, {"n": 6, "q": "Раздел фармакологии, изучающий взаимодействие лекарства с организмом, приводящее к определенному терапевтическому эффекту", "o": ["Фармация", "Фармакокинетика", "Биохимическая фармакология", "Фармакодинамика"], "c": 3}, {"n": 7, "q": "Большая часть лекарственного вещества попадает в общий кровоток, проходя печеночный барьер, при введении", "o": ["сублингвально", "внутрь", "ректально", "внутримышечно"], "c": 1}, {"n": 8, "q": "Ошибочное утверждение о фильтрации", "o": ["Не зависит от концентрации", "Обеспечивает всасывание полярных лекарственных веществ", "Зависит от величины молекул лекарственного вещества", "Осуществляется без затрат энергии"], "c": 0}, {"n": 9, "q": "Основной механизм проникновения лекарственных веществ через гематоэнцефалический барьер", "o": ["Пассивная диффузия", "Активный транспорт", "Фильтрация", "Пиноцитоз"], "c": 0}, {"n": 10, "q": "Основной механизм всасывания липофильных лекарственных веществ в ЖКТ", "o": ["Пассивная диффузия", "Активный транспорт", "Фильтрация", "Пиноцитоз"], "c": 0}, {"n": 11, "q": "Биотрансформация лекарственных веществ в большинстве случаев приводит к образованию метаболитов и конъюгатов, которые", "o": ["лучше реабсорбируются в почечных канальцах", "более гидрофильны, чем исходное вещество", "более активны, чем исходное вещество", "более липофильны, чем исходное вещество"], "c": 1}, {"n": 12, "q": "Газообразные вещества выделяются преимущественно", "o": ["через кожу", "через почки", "через легкие", "через кишечник"], "c": 2}, {"n": 13, "q": "Неправильное утверждение", "o": ["Неполярные соединения лучше всасываются в ЖКТ, чем полярные", "Полярные соединения легче выводятся почками, чем неполярные", "Неполярные соединения проникают через мембрану путем пассивной диффузии", "Гидрофильные вещества легче липофильных проходят через гематоэнцефалический барьер"], "c": 3}, {"n": 14, "q": "ЛС, в значительной степени связанные с белками плазмы крови", "o": ["оказывают более сильное действие", "легче проникают через гематоэнцефалический барьер", "быстрее выводятся из организма", "действуют более продолжительно"], "c": 3}, {"n": 15, "q": "Лекарственные вещества, в значительной степени связанные с белками плазмы крови,", "o": ["подвергаются более быстрой биотрансформации в печени", "имеют более длительный латентный период действия", "не кумулируют", "не вызывают привыкания"], "c": 1}, {"n": 16, "q": "Возможные изменения ЛС в процессе биотрансформации НЕ включают", "o": ["появление отсутствовавшей фармакологической активности", "облегчение прохождения через гематоэнцефалический барьер", "подготовка к выведению из организма", "уменьшение фармакологической активности"], "c": 1}, {"n": 17, "q": "Правильное утверждение", "o": ["Ингаляционное введение относится к энтеральным путям введения веществ", "Интенсивность связывания с белками плазмы определяет липофильность вещества", "Индукторы микросомальных ферментов печени могут уменьшать длительность действия веществ", "В щелочной среде кишечника легко всасываются слабокислые соединения"], const KEY = 'pharm-m1-v1';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const byN = Object.fromEntries(QS.map(q => [q.n, q]));

/* ---------- saved progress (this browser only) ---------- */
let P = { lvl: {}, miss: {} };           // lvl: 0 new/learning, 1 once right, 2 learned
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.lvl) P = { lvl: s.lvl, miss: s.miss || {} }; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} };
const lvl = n => P.lvl[n] ?? -1;         // -1 = not seen yet
const counts = () => { let ok = 0, mid = 0; for (const q of QS) { const l = lvl(q.n); if (l >= 2) ok++; else if (l >= 0) mid++; } return { ok, mid, fresh: QS.length - ok - mid }; };

/* ---------- shared question rendering ---------- */
function optionOrder(q) { return shuffle([0, 1, 2, 3]); }
function optsHtml(q, order, st) {      // st: {picked, reveal}
  return order.map((oi, i) => {
    let cls = 'opt';
    if (st.reveal) { if (oi === q.c) cls += ' right'; else if (oi === st.picked) cls += ' wrong'; }
    else if (oi === st.picked) cls += ' sel';
    return `<button class="${cls}" data-oi="${oi}" ${st.reveal ? 'disabled' : ''}><span class="k">${i + 1}</span><span class="t"><span>${esc(q.o[oi])}</span></span></button>`;
  }).join('');
}

/* ---------- LEARN ---------- */
let L = null;
function learnStart() {
  const pool = shuffle(QS.filter(q => lvl(q.n) < 2).map(q => q.n));
  L = { queue: pool, cur: null, order: null, picked: null, reveal: false, streak: 0 };
  learnNext();
}
function learnNext() {
  if (!L.queue.length) { L.cur = null; return render(); }
  L.cur = L.queue.shift(); L.fresh = lvl(L.cur) < 0; L.order = optionOrder(byN[L.cur]); L.picked = null; L.reveal = false; render();
}
function learnPick(oi) {
  if (L.reveal) return;
  const q = byN[L.cur]; L.picked = oi; L.reveal = true;
  if (oi === q.c) {
    const nl = Math.max(lvl(q.n), 0) + 1; P.lvl[q.n] = Math.min(nl, 2); L.streak++;
    if (nl < 2) L.queue.splice(Math.min(L.queue.length, 8 + Math.floor(Math.random() * 5)), 0, q.n);
  } else {
    P.lvl[q.n] = 0; P.miss[q.n] = (P.miss[q.n] || 0) + 1; L.streak = 0;
    L.queue.splice(Math.min(L.queue.length, 3 + Math.floor(Math.random() * 3)), 0, q.n);
  }
  save(); render();
}
function progHtml() {
  const c = counts(), t = QS.length;
  return `<div class="prog">
    <div class="bar" role="img" aria-label="Выучено ${c.ok} из ${t}"><i class="b-ok" style="width:${c.ok / t * 100}%"></i><i class="b-mid" style="width:${c.mid / t * 100}%"></i></div>
    <div class="legend"><span><span class="dot" style="background:var(--ok)"></span>Выучено <b>${c.ok}</b></span><span><span class="dot" style="background:var(--accent)"></span>В работе <b>${c.mid}</b></span><span><span class="dot" style="background:var(--line)"></span>Новые <b>${c.fresh}</b></span></div>
  </div>`;
}
function learnHtml() {
  if (!L) learnStartSilent();
  if (L.cur == null) {
    return progHtml() + `<div class="card center"><div class="big">${counts().ok}/${QS.length}</div><h2>Все вопросы выучены</h2>
      <p class="hint">Каждый вопрос ты дважды подряд ответил верно. Проверь себя в пробном тесте или начни заново.</p>
      <div class="row" style="justify-content:center"><button class="btn" data-act="go-exam">Пробный тест</button><button class="btn ghost" data-act="ask-reset">Начать заново</button></div>
      ${resetHtml()}</div>`;
  }
  const q = byN[L.cur], ok = L.picked === q.c, l = lvl(q.n);
  let foot = `<span class="hint">Клавиши 1–4 выбирают ответ</span>`;
  if (L.reveal) foot = `<span class="verdict ${ok ? 'ok' : 'bad'}">${ok ? (l >= 2 ? 'Верно. Вопрос выучен' : 'Верно. Спрошу ещё раз позже') : 'Неверно. Правильный ответ выделен'}</span><button class="btn" data-act="next" id="next-btn">Дальше</button>`;
  return progHtml() + `<div class="card">
    <div class="meta"><span>Вопрос <span class="num">№ ${q.n}</span></span><span>${P.miss[q.n] ? 'Ошибок в нём: <span class="num">' + P.miss[q.n] + '</span>' : (L.fresh ? 'Новый' : '')}</span></div>
    <p class="q">${esc(q.q)}</p>
    <div class="opts">${optsHtml(q, L.order, L)}</div>
    ${L.reveal && q.note ? `<p class="note">${esc(q.note)}</p>` : ''}
    <div class="foot">${foot}</div>
  </div>
  <div class="row" style="justify-content:space-between"><span class="hint">Вопрос считается выученным после двух верных ответов подряд. Ошибки возвращаются через несколько вопросов.</span><button class="btn ghost" data-act="ask-reset">Сбросить прогресс</button></div>${resetHtml()}`;
}
function learnStartSilent() { const pool = shuffle(QS.filter(q => lvl(q.n) < 2).map(q => q.n)); L = { queue: pool, cur: null, order: null, picked: null, reveal: false, streak: 0 }; if (pool.length) { L.cur = L.queue.shift(); L.fresh = lvl(L.cur) < 0; L.order = optionOrder(byN[L.cur]); } }
let askReset = false;
function resetHtml() { return askReset ? `<div class="card" style="border-color:var(--bad)"><p>Стереть весь прогресс и начать с нуля?</p><div class="row"><button class="btn danger" data-act="do-reset">Стереть</button><button class="btn ghost" data-act="no-reset">Отмена</button></div></div>` : ''; }

/* ---------- EXAM (30 questions, 25 minutes, as in the real test) ---------- */
const EX_N = 30, EX_SEC = 25 * 60;
let X = null, tick = null;
function examStart() {
  const ns = shuffle(QS.map(q => q.n)).slice(0, EX_N);
  X = { ns, orders: ns.map(n => optionOrder(byN[n])), ans: ns.map(() => null), i: 0, end: Date.now() + EX_SEC * 1000, done: false };
  clearInterval(tick); tick = setInterval(examTick, 1000); render();
}
function examLeft() { return Math.max(0, Math.round((X.end - Date.now()) / 1000)); }
function examTick() { if (!X || X.done) return clearInterval(tick); const s = examLeft(); const el = $('#timer'); if (el) { el.textContent = fmt(s); el.classList.toggle('low', s <= 120); } if (s <= 0) examFinish(); }
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
function examFinish() {
  X.done = true; X.used = EX_SEC - examLeft(); clearInterval(tick);
  X.ns.forEach((n, k) => { if (X.ans[k] !== byN[n].c) { P.lvl[n] = 0; P.miss[n] = (P.miss[n] || 0) + 1; } else if (lvl(n) < 0) P.lvl[n] = 1; });
  save(); L = null; render();
}
function examHtml() {
  if (!X) return `<div class="card"><h2>Пробный тест</h2>
    <p>Как на настоящем тесте: <b>30 случайных вопросов</b> из 105 и <b>25 минут</b>. Правильные ответы покажу только в конце.</p>
    <p class="hint">Вопросы, в которых ошибёшься, вернутся в «Заучивание».</p>
    <div><button class="btn" data-act="exam-start">Начать тест</button></div></div>`;
  if (X.done) {
    const right = X.ns.filter((n, k) => X.ans[k] === byN[n].c).length, pct = Math.round(right / EX_N * 100);
    const wrong = X.ns.map((n, k) => ({ q: byN[n], a: X.ans[k] })).filter(x => x.a !== x.q.c);
    return `<div class="card center"><div class="big">${right}/${EX_N}</div><h2>${pct}% верных ответов</h2>
      <p class="hint">Время: <span class="num">${fmt(X.used)}</span> из 25:00. ${wrong.length ? 'Ошибки разобраны ниже и добавлены в «Заучивание».' : 'Ни одной ошибки.'}</p>
      <div class="row" style="justify-content:center"><button class="btn" data-act="exam-start">Ещё раз</button>${wrong.length ? '<button class="btn ghost" data-act="go-learn">Учить ошибки</button>' : ''}</div></div>
      ${wrong.length ? `<div class="card"><h2>Ошибки: ${wrong.length}</h2>${wrong.map(x => `<div class="item"><div class="iq"><span class="n">№ ${x.q.n}</span>${esc(x.q.q)}</div>
        <p style="color:var(--bad);font-size:15px">${x.a == null ? 'Нет ответа' : 'Твой ответ: ' + esc(x.q.o[x.a])}</p>
        <p style="font-size:15px">Верно: <span style="background:var(--marker);color:var(--marker-ink);padding:0 4px;border-radius:2px">${esc(x.q.o[x.q.c])}</span></p>${x.q.note ? `<p class="note">${esc(x.q.note)}</p>` : ''}</div>`).join('')}</div>` : ''}`;
  }
  const q = byN[X.ns[X.i]], answered = X.ans.filter(a => a != null).length;
  return `<div class="card">
    <div class="meta"><span>Вопрос <span class="num">${X.i + 1}</span> из <span class="num">${EX_N}</span></span><span class="timer" id="timer">${fmt(examLeft())}</span></div>
    <p class="q">${esc(q.q)}</p>
    <div class="opts">${optsHtml(q, X.orders[X.i], { picked: X.ans[X.i], reveal: false })}</div>
    <div class="foot"><button class="btn ghost" data-act="exam-prev" ${X.i === 0 ? 'disabled' : ''}>Назад</button>
      ${X.i < EX_N - 1 ? '<button class="btn" data-act="exam-next">Дальше</button>' : '<button class="btn" data-act="exam-finish">Завершить</button>'}</div>
  </div>
  <div class="dots">${X.ns.map((n, k) => `<button class="${X.ans[k] != null ? 'done' : ''} ${k === X.i ? 'cur' : ''}" data-goto="${k}" aria-label="Вопрос ${k + 1}">${k + 1}</button>`).join('')}</div>
  <div class="row" style="justify-content:space-between"><span class="hint">Отвечено <span class="num">${answered}</span> из <span class="num">${EX_N}</span></span><button class="btn ghost" data-act="exam-finish">Завершить тест</button></div>`;
}

/* ---------- LIST ---------- */
let F = { text: '', only: 'all' };
function listItems() {
  const t = F.text.trim().toLowerCase();
  return QS.filter(q => {
    if (F.only === 'miss' && !P.miss[q.n]) return false;
    if (F.only === 'todo' && lvl(q.n) >= 2) return false;
    if (!t) return true;
    return (q.q + ' ' + q.o.join(' ')).toLowerCase().includes(t);
  });
}
function listBody() {
  const items = listItems();
  if (!items.length) return `<p class="hint" style="padding-block:14px">Ничего не найдено.</p>`;
  return items.map(q => { const l = lvl(q.n);
    return `<div class="item"><div class="iq"><span class="n">№ ${q.n}</span>${esc(q.q)} ${l >= 2 ? '<span class="tag ok">выучен</span>' : P.miss[q.n] ? `<span class="tag bad">ошибок: ${P.miss[q.n]}</span>` : l >= 0 ? '<span class="tag mid">в работе</span>' : ''}</div>
      <ol>${q.o.map((o, i) => `<li class="${i === q.c ? 'c' : ''}"><span>${esc(o)}</span></li>`).join('')}</ol>${q.note ? `<p class="note">${esc(q.note)}</p>` : ''}</div>`; }).join('');
}
function listHtml() {
  const chip = (k, t) => `<button class="chip" data-only="${k}" aria-pressed="${F.only === k}">${t}</button>`;
  return `<div class="card" style="gap:12px">
    <input class="search" id="search" type="search" placeholder="Поиск по вопросам и ответам" value="${esc(F.text)}" autocomplete="off">
    <div class="chips">${chip('all', 'Все')}${chip('miss', 'С ошибками')}${chip('todo', 'Ещё не выучены')}</div>
    <p class="hint">Правильный ответ выделен маркером, как в файле кафедры. Порядок вариантов — как в файле.</p>
    <div id="list-body">${listBody()}</div></div>`;
}

/* ---------- shell ---------- */
let TAB = ['learn', 'exam', 'list'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'learn';
function render() {
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === TAB));
  $('#view').innerHTML = `<div style="display:flex;flex-direction:column;gap:16px">${TAB === 'learn' ? learnHtml() : TAB === 'exam' ? examHtml() : listHtml()}</div>`;
  const nb = $('#next-btn'); if (nb) nb.focus({ preventScroll: true });
}
function setTab(t) { TAB = t; askReset = false; try { history.replaceState(null, '', '#' + t); } catch (e) {} render(); }
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]'); if (tab) return setTab(tab.dataset.tab);
  const opt = e.target.closest('.opt');
  if (opt && !opt.disabled) { const oi = +opt.dataset.oi; if (TAB === 'learn') return learnPick(oi); if (TAB === 'exam' && X && !X.done) { X.ans[X.i] = oi; return render(); } }
  const go = e.target.closest('[data-goto]'); if (go) { X.i = +go.dataset.goto; return render(); }
  const only = e.target.closest('[data-only]'); if (only) { F.only = only.dataset.only; return render(); }
  const a = e.target.closest('[data-act]'); if (!a) return;
  switch (a.dataset.act) {
    case 'next': return learnNext();
    case 'ask-reset': askReset = true; return render();
    case 'no-reset': askReset = false; return render();
    case 'do-reset': P = { lvl: {}, miss: {} }; save(); askReset = false; L = null; return render();
    case 'go-exam': return setTab('exam');
    case 'go-learn': L = null; return setTab('learn');
    case 'exam-start': return examStart();
    case 'exam-prev': X.i = Math.max(0, X.i - 1); return render();
    case 'exam-next': X.i = Math.min(EX_N - 1, X.i + 1); return render();
    case 'exam-finish': return examFinish();
  }
});
document.addEventListener('input', e => { if (e.target.id === 'search') { F.text = e.target.value; $('#list-body').innerHTML = listBody(); } });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key >= '1' && e.key <= '4') {
    const k = +e.key - 1;
    if (TAB === 'learn' && L && L.cur != null && !L.reveal) { e.preventDefault(); learnPick(L.order[k]); }
    else if (TAB === 'exam' && X && !X.done) { e.preventDefault(); X.ans[X.i] = X.orders[X.i][k]; render(); }
  } else if (e.key === 'Enter' || e.key === 'ArrowRight') {
    if (TAB === 'learn' && L && L.reveal) { e.preventDefault(); learnNext(); }
    else if (TAB === 'exam' && X && !X.done && X.i < EX_N - 1 && e.target.tagName !== 'BUTTON') { e.preventDefault(); X.i++; render(); }
  } else if (e.key === 'ArrowLeft' && TAB === 'exam' && X && !X.done && X.i > 0) { X.i--; render(); }
});
render();
</script>

</body>
</html>
